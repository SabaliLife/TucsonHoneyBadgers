<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tucson Honey Badgers — Picture Day Info Form</title>
<style>
  :root {
    --gold: #e8a000;
    --dark: #1a1a1a;
    --gray: #555;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 20px 10px;
    color: var(--dark);
  }
  .card {
    max-width: 560px;
    margin: 0 auto;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,.12);
    overflow: hidden;
  }
  .header {
    background: var(--dark);
    color: #fff;
    padding: 24px 28px;
    border-bottom: 5px solid var(--gold);
  }
  .header h1 { margin: 0 0 4px; font-size: 1.5rem; }
  .header h1 span { color: var(--gold); }
  .header p { margin: 0; color: #ccc; font-size: .9rem; }
  form { padding: 24px 28px 32px; }
  fieldset {
    border: 1px solid #ddd;
    border-radius: 8px;
    margin: 0 0 20px;
    padding: 16px 18px 18px;
  }
  legend {
    font-weight: 700;
    font-size: .85rem;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--gray);
    padding: 0 8px;
  }
  label {
    display: block;
    font-size: .85rem;
    font-weight: 600;
    margin: 12px 0 4px;
  }
  label:first-of-type { margin-top: 0; }
  .req { color: #c00; }
  input[type=text], input[type=tel], input[type=email], select, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 1rem;
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus {
    outline: 2px solid var(--gold);
    border-color: var(--gold);
  }
  .row { display: flex; gap: 14px; }
  .row > div { flex: 1; }
  .radio-group { display: flex; gap: 20px; margin-top: 4px; }
  .radio-group label { display: flex; align-items: center; gap: 6px; font-weight: 400; margin: 0; }
  button {
    width: 100%;
    background: var(--gold);
    color: var(--dark);
    border: none;
    border-radius: 6px;
    padding: 14px;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
  }
  button:hover { background: #c98a00; }
  .note { font-size: .8rem; color: var(--gray); margin-top: 12px; text-align: center; }
  @media (max-width: 480px) { .row { flex-direction: column; gap: 0; } }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>Tucson <span>Honey Badgers</span> Basketball</h1>
    <p>Picture Day Information Form</p>
  </div>
  <form action="https://formsubmit.co/tuchoneybadgers@gmail.com" method="POST">
    <!-- FormSubmit settings -->
    <input type="hidden" name="_subject" value="Picture Day Form Submission">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_captcha" value="false">

    <fieldset>
      <legend>Who is filling this out?</legend>
      <div class="radio-group">
        <label><input type="radio" name="Submitted By" value="Player / Parent" checked> Player / Parent</label>
        <label><input type="radio" name="Submitted By" value="Coach"> Coach</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Player Info</legend>
      <div class="row">
        <div>
          <label>First Name <span class="req">*</span></label>
          <input type="text" name="Player First Name" required>
        </div>
        <div>
          <label>Last Name <span class="req">*</span></label>
          <input type="text" name="Player Last Name" required>
        </div>
      </div>
      <div class="row">
        <div>
          <label>Team Name <span class="req">*</span></label>
          <input type="text" name="Team Name" required>
        </div>
        <div>
          <label>Jersey # <span class="req">*</span></label>
          <input type="text" name="Jersey Number" inputmode="numeric" required>
        </div>
      </div>
      <label>Grade / Age</label>
      <input type="text" name="Grade or Age">
      <label>Coach Name</label>
      <input type="text" name="Coach Name">
    </fieldset>

    <fieldset>
      <legend>Parent / Guardian Contact</legend>
      <label>Name <span class="req">*</span></label>
      <input type="text" name="Parent Name" required>
      <div class="row">
        <div>
          <label>Phone <span class="req">*</span></label>
          <input type="tel" name="Parent Phone" required>
        </div>
        <div>
          <label>Email <span class="req">*</span></label>
          <input type="email" name="Parent Email" required>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Photo Notes</legend>
      <label>Sibling / buddy photo requests, special notes</label>
      <textarea name="Photo Notes" rows="3"></textarea>
    </fieldset>

    <button type="submit">Submit</button>
    <p class="note">Submissions go to the Tucson Honey Badgers team email.</p>
  </form>
</div>
</body>
</html>
